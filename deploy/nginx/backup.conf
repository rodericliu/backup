# nginx in front of backup-server: serves the web UI and proxies /api/ to
# backup-server on 127.0.0.1:8443 in the same pod. Agents do not pass
# through nginx; they connect to agent_listen on the server's internal IP.

upstream backup_server {
    server 127.0.0.1:8443;
    keepalive 16;
}

# Reject requests for other names and bare IPs.
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name bup.ideawisegroup.com;

    # certbot --webroot -w /srv/backup-server/nginx/acme
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://bup.ideawisegroup.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bup.ideawisegroup.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build output.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page application: client-side routes fall back to index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Management API; backup-server adds its own security headers.
    location /api/ {
        proxy_pass https://backup_server;
        include /etc/nginx/snippets/backup-proxy.conf;
    }

    location = /healthz {
        proxy_pass https://backup_server;
        include /etc/nginx/snippets/backup-proxy.conf;
    }
}

# Health check of nginx itself, reachable only inside the pod.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health {
        return 200 "ok\n";
    }
}
