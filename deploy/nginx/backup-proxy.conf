proxy_http_version 1.1;
proxy_set_header Connection "";
# backup-server compares Origin with Host to reject cross-site requests.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;

# backup-server's certificate is issued by its private CA and must include
# this name (backup-server cert issue -host bup.ideawisegroup.com ...).
proxy_ssl_trusted_certificate /etc/nginx/backup-ca/ca.crt;
proxy_ssl_verify on;
proxy_ssl_name bup.ideawisegroup.com;
proxy_ssl_server_name on;
proxy_ssl_session_reuse on;

# Server-sent events (/api/v1/events/stream, assistant answers).
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 5m;
