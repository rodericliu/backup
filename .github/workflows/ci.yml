name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: zstd
        run: zstd --version || (sudo apt-get update && sudo apt-get install -y zstd)
      - name: gofmt
        run: make fmt-check
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: make vet
      - name: test
        run: make test
      - name: build
        run: make build
